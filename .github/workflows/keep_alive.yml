name: Despertador do Streamlit

on:
  schedule:
    # Roda a cada 15 minutos para não dar tempo de "esfriar" a memória
    - cron: "*/15 * * * *"
  workflow_dispatch: # Botão manual mantido

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitando o App com disfarce de navegador
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -s -o /dev/null -w "Status HTTP: %{http_code}\n" \
          https://monitor-focos-queimadas.streamlit.app/
