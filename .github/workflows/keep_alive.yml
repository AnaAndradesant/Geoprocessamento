name: Despertador do Streamlit

on:
  schedule:
    - cron: "0 12 * * *" # Roda uma vez por dia
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit app
        run: |
          curl -I -L --max-redirs 50 \
          -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          https://monitor-focos-queimadas.streamlit.app/
