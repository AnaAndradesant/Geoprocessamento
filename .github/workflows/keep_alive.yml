name: Despertador do Streamlit

on:
  schedule:
    # Este cron configura o robô para rodar a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente, se precisar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitando o App para mante-lo acordado
        run: |
          curl -s -o /dev/null -w "Status HTTP: %{http_code}\n" https://monitor-focos-queimadas.streamlit.app/
