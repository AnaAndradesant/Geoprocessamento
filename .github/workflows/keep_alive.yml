name: Despertador do Streamlit

on:
  schedule:
    # Roda a cada 15 minutos para não dar tempo de "esfriar" a memória
    - cron: "*/6 * * * *"
  workflow_dispatch: # Botão manual mantido

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit app
        run: |
           curl -L -w "\nStatus: %{http_code}\n" https://monitor-focos-queimadas.streamlit.app/
