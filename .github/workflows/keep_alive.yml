name: Despertador do Streamlit

on:
  schedule:
    - cron: "0 12 * * *" # Roda uma vez por dia (suficiente)
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Wake up Streamlit App
        run: |
          python -c "
          import requests
          url = 'https://monitor-focos-queimadas.streamlit.app/'
          headers = {'User-Agent': 'Mozilla/5.0'}
          try:
              # O Python vai seguir os redirecionamentos automaticamente
              response = requests.get(url, headers=headers, timeout=30)
              print(f'Status Code: {response.status_code}')
              if response.status_code == 200:
                  print('App acordado com sucesso!')
          except Exception as e:
              print(f'Erro ao acessar: {e}')
          "
